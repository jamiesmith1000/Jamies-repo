<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: monospace;
      color: #fff;
    }
    canvas {
      border: 2px solid #fff;
      max-width: 100%;
      height: auto;
      touch-action: none;
    }
    #info {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="pong" width="800" height="500"></canvas>
  <div id="info">
    Left player: drag left half &nbsp;|&nbsp; Right player: drag right half<br>
    Tap to Start/Pause &nbsp;|&nbsp; Keyboard: W/S &nbsp; ↑/↓ &nbsp; Enter
  </div>
  <script src="pong.js"></script>
</body>
</html>
